<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="goldMani" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE89E"/>
      <stop offset="35%" stop-color="#F5C443"/>
      <stop offset="70%" stop-color="#D49A24"/>
      <stop offset="100%" stop-color="#A67012"/>
    </linearGradient>
    <linearGradient id="darkMani" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262626"/>
      <stop offset="60%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>
    <filter id="glowMani" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Circle (Obsidian & Luxury Gold Ring) -->
  <circle cx="128" cy="128" r="122" fill="url(#darkMani)"/>
  <circle cx="128" cy="128" r="121" fill="none" stroke="url(#goldMani)" stroke-width="3.5"/>
  <circle cx="128" cy="128" r="113" fill="none" stroke="url(#goldMani)" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.7"/>

  <!-- Manicure Iconography -->
  <g transform="translate(128, 130)" text-anchor="middle">
    <!-- Luxury Polish Bottle (Left) -->
    <g transform="translate(-46, -10)">
      <!-- Bottle Cap -->
      <rect x="-9" y="-48" width="18" height="26" rx="2" fill="url(#goldMani)"/>
      <line x1="-9" y1="-35" x2="9" y2="-35" stroke="#111" stroke-width="1.5" opacity="0.6"/>
      <!-- Bottle Neck -->
      <rect x="-5" y="-22" width="10" height="5" fill="url(#goldMani)"/>
      <!-- Bottle Body -->
      <rect x="-20" y="-17" width="40" height="48" rx="6" fill="#1A1A1A" stroke="url(#goldMani)" stroke-width="2.5"/>
      <!-- Polish Liquid Fill -->
      <path d="M -16 6 Q 0 10 16 6 L 16 25 Q 16 27 13 27 L -13 27 Q -16 27 -16 25 Z" fill="url(#goldMani)" opacity="0.85"/>
      <!-- Label Details -->
      <circle cx="0" cy="5" r="7" fill="none" stroke="url(#goldMani)" stroke-width="1.2"/>
      <line x1="-3" y1="5" x2="3" y2="5" stroke="url(#goldMani)" stroke-width="1.2"/>
    </g>

    <!-- Manicured Hand & Nails (Right) -->
    <g transform="translate(24, 0)">
      <!-- Fingers Contours -->
      <!-- Middle Finger -->
      <path d="M -4 40 L -4 -25 C -4 -42 16 -42 16 -25 L 16 40" fill="none" stroke="url(#goldMani)" stroke-width="3" stroke-linecap="round"/>
      <!-- Middle Finger Nail -->
      <path d="M -0.5 -22 C -0.5 -38 12.5 -38 12.5 -22 C 12.5 -16 -0.5 -16 -0.5 -22 Z" fill="url(#goldMani)" opacity="0.9"/>
      <!-- Nail Polish Highlight -->
      <path d="M 2 -32 Q 4 -35 8 -35" stroke="#FFF" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.8"/>

      <!-- Index Finger -->
      <path d="M -22 40 L -22 -10 C -22 -24 -6 -24 -6 -10 L -6 18" fill="none" stroke="url(#goldMani)" stroke-width="3" stroke-linecap="round"/>
      <!-- Index Finger Nail -->
      <path d="M -18.5 -8 C -18.5 -22 -9.5 -22 -9.5 -8 C -9.5 -3 -18.5 -3 -18.5 -8 Z" fill="url(#goldMani)" opacity="0.85"/>

      <!-- Ring Finger -->
      <path d="M 16 16 L 16 -12 C 16 -26 32 -26 32 -12 L 32 40" fill="none" stroke="url(#goldMani)" stroke-width="3" stroke-linecap="round"/>
      <!-- Ring Finger Nail -->
      <path d="M 19.5 -10 C 19.5 -24 28.5 -24 28.5 -10 C 28.5 -5 19.5 -5 19.5 -10 Z" fill="url(#goldMani)" opacity="0.85"/>
    </g>

    <!-- Fine Polish Droplet / Applicator Accent -->
    <path d="M -12 -12 Q -2 -14 -4 -3 Q -5 4 -10 2 Q -15 0 -12 -12 Z" fill="url(#goldMani)"/>

    <!-- Salon Sparkle Stars -->
    <g transform="translate(54, -38)">
      <path d="M 0 -10 Q 0 0 10 0 Q 0 0 0 10 Q 0 0 -10 0 Q 0 0 0 -10 Z" fill="url(#goldMani)"/>
    </g>
    <g transform="translate(-45, -55) scale(0.65)">
      <path d="M 0 -10 Q 0 0 10 0 Q 0 0 0 10 Q 0 0 -10 0 Q 0 0 0 -10 Z" fill="url(#goldMani)"/>
    </g>
    <g transform="translate(18, -52) scale(0.5)">
      <path d="M 0 -10 Q 0 0 10 0 Q 0 0 0 10 Q 0 0 -10 0 Q 0 0 0 -10 Z" fill="#FFE89E"/>
    </g>
  </g>
</svg>
