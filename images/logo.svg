<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1492 640" width="1492" height="640">
  <defs>
    <!-- Brand Gold Gradient -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4A738"/>
      <stop offset="35%" stop-color="#E2B33D"/>
      <stop offset="70%" stop-color="#B8861B"/>
      <stop offset="100%" stop-color="#FCD561"/>
    </linearGradient>

    <!-- Calligraphic Heart Red-to-Orange Gradient from Reference -->
    <linearGradient id="heart-grad" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#D92822"/>
      <stop offset="25%" stop-color="#E74126"/>
      <stop offset="55%" stop-color="#F36F21"/>
      <stop offset="80%" stop-color="#F99824"/>
      <stop offset="100%" stop-color="#EE581F"/>
    </linearGradient>
  </defs>

  <!-- Encompassing Open Heart Shape (Background Layer) -->
  <g class="logo-heart" opacity="0.95">
    <!-- Left Lobe of Open Heart -->
    <path d="M 746 170 
             C 715 120, 635 38, 515 38 
             C 395 38, 305 125, 305 245 
             C 305 345, 365 435, 455 505 
             C 470 517, 482 523, 488 525 
             C 480 518, 470 505, 456 492 
             C 382 422, 338 340, 338 250 
             C 338 148, 415 72, 512 72 
             C 615 72, 692 140, 746 170 Z" 
          fill="url(#heart-grad)"/>

    <!-- Right Lobe & Swooping Open Tail -->
    <path d="M 746 170 
             C 788 118, 882 38, 1010 38 
             C 1140 38, 1240 135, 1240 260 
             C 1240 385, 1165 488, 1050 555 
             C 935 622, 775 640, 615 630 
             C 505 622, 405 585, 350 528 
             C 345 522, 348 520, 355 523 
             C 415 565, 518 592, 625 598 
             C 770 605, 915 585, 1015 525 
             C 1115 465, 1180 375, 1180 265 
             C 1180 158, 1098 75, 995 75 
             C 885 75, 798 140, 746 170 Z" 
          fill="url(#heart-grad)"/>
  </g>

  <!-- Foreground Layer: Current Logo sits on top of heart shape -->
  <!-- Main Brand Name: THE ONE (Enlarged to fill space) -->
  <text x="746" y="225" 
        font-family="'Playfair Display', 'Cinzel', 'Didot', 'Georgia', serif" 
        font-size="190" 
        font-weight="900" 
        letter-spacing="24" 
        fill="#111111" 
        text-anchor="middle">THE ONE</text>

  <!-- Script Subheading: Nail Salon (Enlarged) -->
  <text x="746" y="395" 
        font-family="'Allura', 'Great Vibes', cursive" 
        font-size="175" 
        font-weight="400" 
        letter-spacing="4" 
        fill="url(#gold)" 
        text-anchor="middle">Nail Salon</text>

  <!-- Divider Line with Diamond -->
  <g transform="translate(746, 465)">
    <line x1="-380" y1="0" x2="-55" y2="0" stroke="#111111" stroke-width="3" opacity="0.9"/>
    <polygon points="0,-10 10,0 0,10 -10,0" fill="url(#gold)"/>
    <circle cx="-28" cy="0" r="4" fill="#111111"/>
    <circle cx="28" cy="0" r="4" fill="#111111"/>
    <line x1="55" y1="0" x2="380" y2="0" stroke="#111111" stroke-width="3" opacity="0.9"/>
  </g>

  <!-- Location Tag: SILVER SPRING, MD (Enlarged) -->
  <text x="746" y="540" 
        font-family="'Poppins', 'Montserrat', sans-serif" 
        font-size="42" 
        font-weight="700" 
        letter-spacing="18" 
        fill="#111111" 
        text-anchor="middle">SILVER SPRING, MD</text>
</svg>