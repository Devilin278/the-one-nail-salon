<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1492 640" width="1492" height="640">
  <defs>
    <linearGradient id="gold-lt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE89E"/>
      <stop offset="50%" stop-color="#F7C42D"/>
      <stop offset="100%" stop-color="#C5921E"/>
    </linearGradient>
  </defs>

  <!-- Main Brand Name: THE ONE (Enlarged) -->
  <text x="746" y="225" 
        font-family="'Playfair Display', 'Cinzel', serif" 
        font-size="190" 
        font-weight="900" 
        letter-spacing="24" 
        fill="#FFFFFF" 
