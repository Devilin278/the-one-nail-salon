  <!-- Divider Line with Diamond -->
  <g transform="translate(746, 465)">
    <line x1="-380" y1="0" x2="-55" y2="0" stroke="url(#gold-lt)" stroke-width="3" opacity="0.9"/>
    <polygon points="0,-10 10,0 0,10 -10,0" fill="#FFFFFF"/>
    <circle cx="-28" cy="0" r="4" fill="url(#gold-lt)"/>
    <circle cx="28" cy="0" r="4" fill="url(#gold-lt)"/>
    <line x1="55" y1="0" x2="380" y2="0" stroke="url(#gold-lt)" stroke-width="3" opacity="0.9"/>
  </g>

  <!-- Location Tag: SILVER SPRING, MD (Enlarged) -->
  <text x="746" y="540" 
        font-family="'Poppins', sans-serif" 
        font-size="42" 
