<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 880" width="100%" height="100%">
  <defs>
    <linearGradient id="roseGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6088"/>
      <stop offset="40%" stop-color="#E82B61"/>
      <stop offset="80%" stop-color="#C71847"/>
      <stop offset="100%" stop-color="#9E0E34"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4A738"/>
      <stop offset="35%" stop-color="#E2B33D"/>
      <stop offset="70%" stop-color="#B8861B"/>
      <stop offset="100%" stop-color="#FCD561"/>
    </linearGradient>
    <filter id="glow1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#C71847" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Encompassing Open Heart: Calligraphic Ribbon Embrace -->
  <g filter="url(#glow1)">
    <path d="M 790,205 
             C 745,135 620,70 450,75 
             C 240,82 120,230 120,410 
             C 120,570 280,700 520,785 
             C 650,830 760,855 800,865 
             C 840,855 960,825 1090,780 
             C 1340,695 1480,560 1480,395 
             C 1480,225 1360,75 1160,75 
             C 990,75 875,150 825,235
             C 810,260 785,285 760,265
             C 745,250 755,225 770,205"
          fill="none" 
          stroke="url(#roseGrad1)" 
          stroke-width="22" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>

  <!-- Central Logo Content -->
  <g transform="translate(54, 40)">
    <!-- Main Brand Name: THE ONE -->
    <text x="746" y="285" 
          font-family="'Playfair Display', 'Cinzel', 'Didot', 'Georgia', serif" 
          font-size="170" 
          font-weight="900" 
          letter-spacing="22" 
          fill="#FFFFFF" 
          text-anchor="middle">THE ONE</text>

    <!-- Script Subheading: Nail Salon -->
    <text x="746" y="435" 
          font-family="'Allura', 'Great Vibes', cursive" 
          font-size="160" 
          font-weight="400" 
          letter-spacing="4" 
          fill="url(#goldGrad)" 
          text-anchor="middle">Nail Salon</text>

    <!-- Divider Line with Diamond -->
    <g transform="translate(746, 498)">
      <line x1="-340" y1="0" x2="-50" y2="0" stroke="#FFFFFF" stroke-width="2.5" opacity="0.85"/>
      <polygon points="0,-9 9,0 0,9 -9,0" fill="url(#goldGrad)"/>
      <circle cx="-25" cy="0" r="3.5" fill="#FFFFFF"/>
      <circle cx="25" cy="0" r="3.5" fill="#FFFFFF"/>
      <line x1="50" y1="0" x2="340" y2="0" stroke="#FFFFFF" stroke-width="2.5" opacity="0.85"/>
    </g>

    <!-- Location Tag: SILVER SPRING, MD -->
    <text x="746" y="565" 
          font-family="'Poppins', 'Montserrat', sans-serif" 
          font-size="38" 
          font-weight="700" 
          letter-spacing="16" 
          fill="#FFFFFF" 
          text-anchor="middle">SILVER SPRING, MD</text>
  </g>
</svg>