<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="goldPedi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE89E"/>
      <stop offset="35%" stop-color="#F5C443"/>
      <stop offset="70%" stop-color="#D49A24"/>
      <stop offset="100%" stop-color="#A67012"/>
    </linearGradient>
    <linearGradient id="darkPedi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262626"/>
      <stop offset="60%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>
  </defs>

  <!-- Base Circle (Obsidian & Luxury Gold Ring) -->
  <circle cx="128" cy="128" r="122" fill="url(#darkPedi)"/>
  <circle cx="128" cy="128" r="121" fill="none" stroke="url(#goldPedi)" stroke-width="3.5"/>
  <circle cx="128" cy="128" r="113" fill="none" stroke="url(#goldPedi)" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.7"/>

  <!-- Pedicure Iconography -->
  <g transform="translate(128, 126)">
    
    <!-- True Anatomical Slender Foot (Side Silhouette) -->
    <!-- Front of leg -> Instep -> Big Toe -> Ball -> Arch -> Heel -> Achilles -> Back of leg -->
    <path d="M 16 -50 
             C 16 -30 14 -10 3 8 
             C -8 20 -25 28 -50 28 
             C -68 28 -76 34 -76 42 
             C -76 48 -68 52 -50 52 
             C -32 52 -18 42 5 42 
             C 25 42 38 52 48 52 
             C 58 52 62 44 62 34 
             C 62 20 54 8 48 -10 
             C 44 -25 42 -40 42 -50" 
          fill="none" 
          stroke="url(#goldPedi)" 
          stroke-width="3" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Ankle Contour -->
    <path d="M 32 8 C 36 12 36 18 32 22" fill="none" stroke="url(#goldPedi)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

    <!-- Prominent Big Toe Polished Nail (Top View on Front Toe) -->
    <path d="M -73 38 C -73 33 -66 31 -56 31 C -56 42 -64 45 -73 43 Z" fill="url(#goldPedi)"/>
    <path d="M -70 34 Q -66 33 -60 33" stroke="#FFF" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.9"/>

    <!-- Perspective Toes (Peeking gracefully behind big toe) -->
    <!-- Toe 2 -->
    <path d="M -54 28 C -54 20 -44 19 -38 23 L -38 28" fill="none" stroke="url(#goldPedi)" stroke-width="2.2" stroke-linecap="round"/>
    <ellipse cx="-45" cy="22" rx="4.5" ry="3.5" fill="url(#goldPedi)"/>
    
    <!-- Toe 3 -->
    <path d="M -38 23 C -38 16 -28 15 -24 20 L -24 26" fill="none" stroke="url(#goldPedi)" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="-30" cy="18" rx="4" ry="3" fill="url(#goldPedi)"/>

    <!-- Toe 4 -->
    <path d="M -24 20 C -24 14 -16 13 -12 18 L -12 24" fill="none" stroke="url(#goldPedi)" stroke-width="1.8" stroke-linecap="round"/>
    <ellipse cx="-17" cy="16" rx="3.2" ry="2.5" fill="url(#goldPedi)"/>

    <!-- Toe 5 (Pinky) -->
    <path d="M -12 18 C -12 13 -5 13 -2 18 L -2 24" fill="none" stroke="url(#goldPedi)" stroke-width="1.6" stroke-linecap="round"/>
    <ellipse cx="-6" cy="16" rx="2.5" ry="2" fill="url(#goldPedi)"/>

    <!-- Gentle Water Basin Ripples (Dipping gently into spa water) -->
    <path d="M -78 58 Q 0 50 78 58" fill="none" stroke="url(#goldPedi)" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
    <path d="M -58 68 Q 0 62 58 68" fill="none" stroke="url(#goldPedi)" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>

    <!-- Spa Lotus Blossom (Floating on Water Left) -->
    <g transform="translate(-50, 48) scale(0.65)">
      <path d="M 0 -22 C -6 -10 0 0 0 0 C 0 0 6 -10 0 -22 Z" fill="url(#goldPedi)"/>
      <path d="M -2 0 C -12 -5 -10 -15 -5 -17 C -2 -13 0 -6 -2 0 Z" fill="url(#goldPedi)" opacity="0.8"/>
      <path d="M 2 0 C 12 -5 10 -15 5 -17 C 2 -13 0 -6 2 0 Z" fill="url(#goldPedi)" opacity="0.8"/>
    </g>

    <!-- Smooth River Basalt Stones (Right) -->
    <ellipse cx="48" cy="50" rx="14" ry="6" fill="url(#goldPedi)" opacity="0.4" stroke="url(#goldPedi)" stroke-width="1.2"/>
    <ellipse cx="56" cy="45" rx="9" ry="4.5" fill="url(#goldPedi)" opacity="0.6"/>

    <!-- Glamour Sparkles -->
    <g transform="translate(-68, 8) scale(0.7)">
      <path d="M 0 -10 Q 0 0 10 0 Q 0 0 0 10 Q 0 0 -10 0 Q 0 0 0 -10 Z" fill="url(#goldPedi)"/>
    </g>
    <g transform="translate(55, -28) scale(0.55)">
      <path d="M 0 -10 Q 0 0 10 0 Q 0 0 0 10 Q 0 0 -10 0 Q 0 0 0 -10 Z" fill="#FFE89E"/>
    </g>
  </g>
</svg>