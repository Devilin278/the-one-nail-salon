<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 880" width="100%" height="100%">
  <defs>
    <linearGradient id="roseGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B93"/>
      <stop offset="30%" stop-color="#F0386B"/>
      <stop offset="70%" stop-color="#CF194C"/>
      <stop offset="100%" stop-color="#940C30"/>
    </linearGradient>
    <linearGradient id="goldGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4A738"/>
      <stop offset="35%" stop-color="#E2B33D"/>
      <stop offset="70%" stop-color="#B8861B"/>
      <stop offset="100%" stop-color="#FCD561"/>
    </linearGradient>
    <filter id="glow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#CF194C" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Encompassing Open Heart: Hand-Drawn Expressive Brush Stroke (Inspired by the physical menu cover) -->
  <g filter="url(#glow3)">
    <!-- Expressive continuous sketch-style heart encompassing the logo -->
    <path d="M 740,190
             C 690,110 560,50 400,65
             C 210,82 105,215 105,395
             C 105,580 260,720 500,805
             C 650,855 765,870 810,870
             C 865,870 995,835 1130,775
             C 1370,670 1500,530 1500,360
             C 1500,190 1375,55 1175,55
             C 1010,55 890,135 830,220
             C 790,280 730,320 680,280
             C 645,250 670,200 710,170"
          fill="none" 
          stroke="url(#roseGrad3)" 
          stroke-width="20" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Romantic calligraphic tail flourish accent -->
    <path d="M 780,865
             C 840,860 920,830 960,805"
          fill="none"
          stroke="url(#roseGrad3)"
          stroke-width="12"
          stroke-linecap="round"
          opacity="0.7"/>
  </g>

  <!-- Central Logo Content -->
  <g transform="translate(54, 40)">
    <!-- Main Brand Name: THE ONE -->
    <text x="746" y="285" 
          font-family="'Playfair Display', 'Cinzel', 'Didot', 'Georgia', serif" 
          font-size="170" 
          font-weight="900" 
          letter-spacing="22" 
          fill="#111111" 
          text-anchor="middle">THE ONE</text>

    <!-- Script Subheading: Nail Salon -->
    <text x="746" y="435" 
          font-family="'Allura', 'Great Vibes', cursive" 
          font-size="160" 
          font-weight="400" 
          letter-spacing="4" 
          fill="url(#goldGrad3)" 
          text-anchor="middle">Nail Salon</text>

    <!-- Divider Line with Diamond -->
    <g transform="translate(746, 498)">
      <line x1="-340" y1="0" x2="-50" y2="0" stroke="#111111" stroke-width="2.5" opacity="0.85"/>
      <polygon points="0,-9 9,0 0,9 -9,0" fill="url(#goldGrad3)"/>
      <circle cx="-25" cy="0" r="3.5" fill="#111111"/>
      <circle cx="25" cy="0" r="3.5" fill="#111111"/>
      <line x1="50" y1="0" x2="340" y2="0" stroke="#111111" stroke-width="2.5" opacity="0.85"/>
    </g>

    <!-- Location Tag: SILVER SPRING, MD -->
    <text x="746" y="565" 
          font-family="'Poppins', 'Montserrat', sans-serif" 
          font-size="38" 
          font-weight="700" 
          letter-spacing="16" 
          fill="#111111" 
          text-anchor="middle">SILVER SPRING, MD</text>
  </g>
</svg>